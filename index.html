const loadData = (key, defaultData) => {
            const saved = localStorage.getItem(key);
            let dataToReturn = defaultData;
            
            if (saved) { 
                try { 
                    const parsedData = JSON.parse(saved);
                    if (key === 'smile_clinic_google_v12') {
                        // هنا السر: ندمج اللي محفوظ (زي الدكاترة) مع الافتراضي عشان ميمسحش حاجة
                        dataToReturn = { ...defaultData, ...parsedData };
                    } else {
                        dataToReturn = parsedData;
                    }
                } catch (e) {} 
            }
            
            if (key === 'smile_clinic_google_v12') {
                // فرض الرابط السحري إجبارياً
                dataToReturn.appsScriptUrl = "https://script.google.com/macros/s/AKfycbzdJP7oVaL9pttfb9nM9fxUTxT53bJww-rCIuyA8aImHWf9Ye2DVS9ZdJ7A_byOrvlhRA/exec";
                // التأكد من وجود مصفوفة أطباء صالحة دون مسح الموجود
                if (!dataToReturn.doctors || !Array.isArray(dataToReturn.doctors)) {
                    dataToReturn.doctors = [];
                }
            }
            
            return dataToReturn;
        };

        const saveData = (key, data) => {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (e) {
                console.error("الذاكرة ممتلئة", e);
                alert("تنبيه هام: ذاكرة المتصفح ممتلئة! يرجى حذف بعض الصور القديمة من ملفات المرضى حتى لا تفقد البيانات الجديدة وتجنب تعليق البرنامج.");
            }
        };

        const timeToMins = (t) => { if(!t) return 0; const [h, m] = t.split(':').map(Number); return (h * 60) + m; };
        const formatAMPM = (t) => {
            if(!t) return '';
            let [h, m] = t.split(':').map(Number);
            const ampm = h >= 12 ? 'م' : 'ص';
            h = h % 12 || 12;
            return `${h}:${m.toString().padStart(2, '0')} ${ampm}`;
        };
const getDateXDaysAgo = (days) => {
            const d = new Date(); d.setDate(d.getDate() - days);
            return d.toISOString().split('T')[0];
        };

        const getClosestUpcomingDate = (appointments) => {
            const today = new Date().toISOString().split('T')[0];
            const upcomingDates = [...new Set(appointments.filter(a => a.date >= today).map(a => a.date))].sort();
            return upcomingDates.length > 0 ? upcomingDates[0] : today;
        };

        const getNextBookedDate = (appointments, currentDate) => {
            const dates = [...new Set(appointments.map(a => a.date))].sort();
            return dates.find(d => d > currentDate) || currentDate;
        };

        const getPrevBookedDate = (appointments, currentDate) => {
            const dates = [...new Set(appointments.map(a => a.date))].sort().reverse();
            return dates.find(d => d < currentDate) || currentDate;
        };


const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    // صغرنا العرض لـ 800 عشان الصورة تبقى خفيفة جداً ومتملاش الذاكرة
                    const MAX_WIDTH = 800; 
                    let scaleSize = MAX_WIDTH / img.width;
                    if(scaleSize > 1) scaleSize = 1; 
                    
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'medium';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // ضغط الجودة لـ 60% مناسب جداً للأشعة والصور وهيخلي مساحتها لا تذكر
                    callback(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        const getPatientTotalCost = (patient) => patient.procedures?.reduce((total, proc) => total + Number(proc.price), 0) || 0;
        const getPatientTotalPaid = (patient) => patient.payments?.reduce((total, pay) => total + Number(pay.amount), 0) || 0;

        const exportToExcel = (patients, appointments, inventory, expenses, logs) => {
            try {
                const wb = XLSX.utils.book_new();
                
                const confirmedPatients = patients.filter(p => p.isConfirmed !== false);
                const patientsData = confirmedPatients.map(p => ({
                    'الاسم': p.name, 'رقم الهاتف': p.phone, 'العنوان': p.address, 'السن': p.age,
                    'الشكوى الرئيسية': p.chiefComplaint || '',
                    'التاريخ الطبي': p.medicalHistory, 'التاريخ السني': p.dentalHistory,
                    'عضوية ذهبية': p.isGoldenMember ? 'نعم' : 'لا',
                    'العيادة المتنقلة': p.isMobileClinic ? 'نعم' : 'لا',
                    'إجمالي التكلفة': getPatientTotalCost(p), 'إجمالي المدفوع': getPatientTotalPaid(p)
                }));
                const wsPatients = XLSX.utils.json_to_sheet(patientsData);
                XLSX.utils.book_append_sheet(wb, wsPatients, "المرضى");

                const apptsData = appointments.map(a => {
                    const pat = patients.find(p => p.id === a.patientId);
                    return { 'تاريخ الموعد': a.date, 'الساعة': formatAMPM(a.time), 'مدة الجلسة': a.duration, 'اسم المريض': pat ? pat.name : 'غير معروف' };
                });
                const wsAppts = XLSX.utils.json_to_sheet(apptsData);
                XLSX.utils.book_append_sheet(wb, wsAppts, "المواعيد");

                const financeData = expenses.map(e => ({ 'التاريخ': e.date, 'النوع': 'مصروف', 'البيان': e.description, 'المبلغ': e.amount }));
                const wsFinance = XLSX.utils.json_to_sheet(financeData);
                XLSX.utils.book_append_sheet(wb, wsFinance, "الماليات");

                XLSX.writeFile(wb, `Smiley_Center_Data_${new Date().toISOString().split('T')[0]}.xlsx`);
            } catch (error) {
                console.error("Excel Export Error:", error);
                alert("حدث خطأ أثناء تصدير ملف الإكسيل. تأكد من اتصالك بالإنترنت لتحميل المكتبة.");

const syncEventToGoogleCalendar = async (appointment, patient, appsScriptUrl, doctorEmail = "") => {
            if (!appsScriptUrl) return { success: false, message: 'الرابط السحري غير مسجل' };
            const startMins = timeToMins(appointment.time);
            const endMins = startMins + (appointment.duration || 30);
            const endH = Math.floor(endMins / 60).toString().padStart(2, '0');
            const endM = (endMins % 60).toString().padStart(2, '0');
            
const payload = {
                action: 'addEvent',
                title: `كشف: ${patient.name}`,
                start: `${appointment.date}T${appointment.time}:00`,
                end: `${appointment.date}T${endH}:${endM}:00`,
                description: `رقم الهاتف: ${patient.phone}\nالشكوى: ${patient.chiefComplaint || 'لا يوجد'}`,
                doctorEmail: doctorEmail,
                patientEmail: patient.email || "" // إرسال إيميل المريض
            };

            try {
                await fetch(appsScriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                return { success: true };
            } catch (err) {
                return { success: false, message: 'خطأ في الاتصال' };
            }
        };


const openWhatsApp = (phone, msg = '', showMessageFn) => {
            if (!phone) return showMessageFn('تنبيه', 'لا يوجد رقم هاتف مسجل!');
            
            // 1. تنظيف الرقم من أي مسافات أو شرطات أو حروف (نخلي أرقام بس)
            let cleanPhone = phone.replace(/\D/g, ''); 
            
            // 2. إضافة كود مصر لو الرقم بيبدأ بـ 0
            if (cleanPhone.startsWith('0')) {
                cleanPhone = '2' + cleanPhone;
            }
            
            // 3. تشفير الرسالة المكتوبة بالذكاء الاصطناعي
            const encodedMsg = encodeURIComponent(msg);
            
            // 4. استخدام الرابط الرسمي والأكثر استقراراً للرسائل الطويلة
            window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedMsg}`, '_blank');
        };

                        systemPrompt = `أنت موظف استقبال وخدمة عملاء ذكي في ${chatSettings.clinicName}. أسلوبك: ${chatSettings.chatTone || 'ودود'}. 
الأسعار: ${chatSettings.prices}. العروض: ${chatSettings.offers}.
الأسئلة الشائعة: ${JSON.stringify(chatSettings.faqs)}. 
قاعدة هامة جداً للحجز: لا تقم أبداً بعرض مواعيد متاحة أو الطلب من المريض اختيار وقت وتاريخ. 
دورك فقط هو جمع بيانات المريض (الاسم، ورقم الهاتف، والشكوى). وإذا أعطاك هذه البيانات، أخبره بلباقة أنه تم رفع طلبه بنجاح وأن قسم الاستقبال سيتواصل معه هاتفياً لتنسيق الموعد المناسب، ثم أضف في نهاية ردك هذا الكود بالظبط: ||BOOK||{"name":"اسمه","phone":"رقمه","complaint":"شكواه"}||`;
                        isNewBooking = true;
} else if (mode === 'followup_chat') {
                        const totalProcsCost = (activeUser.procedures || []).reduce((sum, p) => sum + Number(p.price || 0), 0);
                        const orthoCost = Number(activeUser.orthoPrice || 0);
                        const grandTotalCost = totalProcsCost + orthoCost;
                        const totalPaidAmount = (activeUser.payments || []).reduce((sum, p) => sum + Number(p.amount || 0), 0);
                        
                        // --- جلب وتنظيم مواعيد المريض للذكاء الاصطناعي ---
                        const patientAppts = appointments.filter(a => a.patientId === activeUser.id);
                        const pastAppointments = patientAppts.filter(a => a.date < todayStr).map(a => ({ date: a.date, time: formatAMPM(a.time), status: "تمت الزيارة" }));
                        const upcomingAppointments = patientAppts.filter(a => a.date >= todayStr).map(a => ({ date: a.date, time: formatAMPM(a.time), status: "موعد قادم بانتظار الحضور" }));
                        
                        const safePatientData = {
                            name: activeUser.name, financials: { totalCost: grandTotalCost, totalPaid: totalPaidAmount, remainingBalance: grandTotalCost - totalPaidAmount },
                            proceduresDone: (activeUser.procedures || []).map(p => ({ name: p.name, price: p.price, date: p.date })),
                            prescriptions: (activeUser.prescriptions || []).map(p => ({ details: p.details, date: p.date })),
                            futurePlans: (activeUser.futurePlans || []).map(p => ({ description: p.description, date: p.dateAdded })),
                            pastAppointments: pastAppointments, // المواعيد السابقة
                            upcomingAppointments: upcomingAppointments // المواعيد القادمة
                        };
                        systemPrompt = `أنت المساعد الذكي لـ ${chatSettings.doctorName}. تتحدث مع المريض "${activeUser.name}". أسلوبك: ${chatSettings.chatTone}. بيانات المريض: ${JSON.stringify(safePatientData)}.
قاعدة هامة جداً للمتابعة: لا تقم أبداً بعرض مواعيد متاحة أو الطلب من المريض اختيار وقت وتاريخ.
إذا طلب المريض حجز جلسة متابعة، أخبره بلباقة أنه تم إرسال طلبه للعيادة وسيتم التواصل معه هاتفياً لتنسيق موعد الجلسة، ثم أضف في نهاية ردك هذا الكود بالظبط: ||FOLLOWUP||{"date":"${todayStr}", "time":"12:00"}||`;
                    }



                    const historyForApi = newHistory.map(m => ({ role: m.role === 'bot' ? 'model' : 'user', parts: [{text: m.text}] }));

                    const payload = { contents: historyForApi, systemInstruction: { parts: [{ text: systemPrompt }] } };

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    
                    if (result.error) {
                        setChatMsgs(prev => [...prev, { role: 'bot', text: `عذراً، يرجى مراجعة إعدادات مفتاح الذكاء الاصطناعي (API Key). \n(${result.error.message})` }]);
                    } else if (result.candidates) {
                        let botReply = result.candidates[0].content.parts[0].text;
                     if (isNewBooking && botReply.includes('||BOOK||')) {

                                // 1. فصل الكلام اللي هيتعرض للمريض عن الكود المخفي

                                const jsonRegex = /\{[\s\S]*\}/;
                                const jsonMatch = parts[1].match(jsonRegex);
                                
                                if (jsonMatch) {
                                    // تنظيف الكود لو حط single quotes بدل double quotes
                                    let rawJson = jsonMatch[0].replace(/'/g, '"');
                                    const bookingData = JSON.parse(rawJson);
                                    
                                    // 3. دعم المفاتيح (عربي وإنجليزي) لأن الذكاء أحياناً بيترجمهم
                                    const patientName = bookingData.name || bookingData["الاسم"] || bookingData.Name || 'مريض غير مسجل';

                                    // 4. تجهيز المريض الجديد

                                        chiefComplaint: patientComplaint,

// === قراءة كود المتابعة من الذكاء الاصطناعي ===

const StaffLogin = ({ onLoginSuccess, onBack, setUserRole }) => {
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [error, setError] = useState(false);
    const [isLoading, setIsLoading] = useState(false);

    const handleLogin = (e) => {
        e.preventDefault();
        if (!window.firebaseAuth) {
            alert('نظام الحماية غير متصل، تأكد من الإنترنت.');
            return;
        }

        setIsLoading(true);
        setError(false);

        // هنا السحر: بنسأل سيرفرات جوجل عن صحة البيانات
        window.firebaseAuth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // لو الإيميل بتاع الأدمن، نديله صلاحيات كاملة
                if (userCredential.user.email === 'admin@smiley.com') { // حط إيميل الأدمن اللي عملته في فايربيز هنا
                    setUserRole('admin');
                } else {
                    setUserRole('receptionist'); // أي إيميل تاني هيكون استقبال
                }
                setIsLoading(false);
                onLoginSuccess();
            })
            .catch((err) => {
                setIsLoading(false);
                setError(true);
            });
    };

    return (

            const handleProcess = async () => {
                if(!file) return showMessage('تنبيه', 'برجاء اختيار ملف أولاً');
                setIsLoading(true);
                
                try {
                    const reader = new FileReader();
                    reader.onload = async () => {
                        const base64Data = reader.result.split(',')[1];
                        const mimeType = file.type || 'image/jpeg';
                        const apiKey = loadData('smile_clinic_google_v12', {}).geminiApiKey || "API_KEY"; 
                        
                        const payload = {
                            contents: [{
                                parts: [
                                    { text: "Extract patient data from this document (could be a paper medical record, ID, or form). Return a JSON object ONLY with the following exact keys (in English): name, age, phone, address, chiefComplaint, medicalHistory, dentalHistory. If a field is not found or unreadable in the image, leave its value as an empty string. Translate Arabic field values to Arabic in the JSON. Do not include markdown formatting like ```json." },
                                    { inlineData: { mimeType, data: base64Data } }
                                ]
                            }],
                            generationConfig: { responseMimeType: "application/json" }
                        };

                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
                        
                        const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const result = await response.json();
                        
                        if (result.candidates && result.candidates.length > 0) {
                            try {
                                const jsonStr = result.candidates[0].content.parts[0].text;
                                const parsed = JSON.parse(jsonStr);
                                onImportSuccess(parsed);

    // ====== المعالج الذكي للأوامر والتنفيذ ======
 const processAIAction = async (actionData, currentAttachments, setAttachments) => {
        let actionMsg = "";
        let actionAttachments = null;
        const today = new Date().toISOString().split('T')[0];

        try {
            const findPatient = (name) => patients.find(p => p.name.includes(name) || (name && name.includes(p.name)));

            switch(actionData.type) {
                case 'book':
                    if(setAppointments) {
                        let matchedPatient = findPatient(actionData.patientName);
                        const finalPatientId = matchedPatient ? matchedPatient.id : Date.now().toString();
                        if (!matchedPatient) {
                            matchedPatient = { id: finalPatientId, name: actionData.patientName, phone: actionData.phone || "", chiefComplaint: "حجز عبر المساعد", isConfirmed: true, procedures: [], payments: [], media: [] };
                            if (setPatients) setPatients(prev => [matchedPatient, ...prev]);
                        }
                        const newAppt = { id: Date.now().toString(), patientId: finalPatientId, date: actionData.date || today, time: actionData.time || "12:00", duration: actionData.duration || 30 };
                        setAppointments(prev => [...prev, newAppt]);
                        actionMsg = `✅ تم حجز الموعد للمريض (${matchedPatient.name}) يوم ${actionData.date} الساعة ${actionData.time}.`;
                    }
                    break;
                case 'cancelAppt':
                    if(setAppointments) {
                        setAppointments(prev => prev.filter(a => a.id !== actionData.apptId));
                        actionMsg = `✅ تم إلغاء الحجز بنجاح.`;
                    }
                    break;
                case 'updatePatient':
                    if(setPatients) {
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? { ...p, [actionData.field]: actionData.value } : p));
                        actionMsg = `✅ تم تحديث ${actionData.field} للمريض ${actionData.patientName}.`;
                    }
                    break;
                case 'addProcedure':
                    if(setPatients) {
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? 
                            { ...p, procedures: [{id: Date.now().toString(), name: actionData.procName, price: actionData.price, date: today}, ...(p.procedures||[])] } : p));
                        actionMsg = `✅ تم تسجيل الإجراء (${actionData.procName}) بتكلفة ${actionData.price} ج.م.`;
                    }
                    break;
                case 'addPayment':
                    if(setPatients) {
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? 
                            { ...p, payments: [{id: Date.now().toString(), amount: actionData.amount, description: actionData.description || 'دفعة نقدية', date: today}, ...(p.payments||[])] } : p));
                        actionMsg = `✅ تم تسجيل مقبوضات نقدية بقيمة ${actionData.amount} ج.م للمريض ${actionData.patientName}.`;
                    }
                    break;
                case 'addExpense':
                    if(setExpenses) {
                        setExpenses(prev => [{id: Date.now().toString(), description: actionData.desc, amount: Number(actionData.amount), date: today}, ...prev]);
                        actionMsg = `✅ تم تسجيل المصروف (${actionData.desc}) بقيمة ${actionData.amount} ج.م.`;
                    }
                    break;
                case 'addDentalChart':
                    if(setPatients) {
                        const chartItem = { id: Date.now().toString(), toothNum: actionData.toothNum, displayNum: actionData.displayNum, type: actionData.statusType, desc: actionData.desc, date: today };
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? { ...p, dentalChart: [chartItem, ...(p.dentalChart||[])] } : p));
                        actionMsg = `✅ تم تحديث الخريطة السنية لسن رقم (${actionData.displayNum}).`;
                    }
                    break;
                case 'addPrescription':
                    if(setPatients) {
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? { ...p, prescriptions: [{id: Date.now().toString(), details: actionData.rxDetails, date: today}, ...(p.prescriptions||[])] } : p));
                        actionMsg = `✅ تم تسجيل الروشتة/خطة العلاج للمريض.`;
                    }
                    break;
                case 'orthoAction':
                    if(setPatients) {
                        setPatients(prev => prev.map(p => {
                            if(p.name.includes(actionData.patientName)) {
                                let updatedP = { ...p };
                                if(actionData.actionType === 'session') updatedP.orthoSessions = [{id: Date.now().toString(), notes: actionData.notes, date: today}, ...(p.orthoSessions||[])];
                                if(actionData.actionType === 'planUpdate') { updatedP.orthoPlan = actionData.notes; updatedP.orthoType = actionData.orthoType || p.orthoType; }
                                return updatedP;
                            }
                            return p;
                        }));
                        actionMsg = `✅ تم تحديث بيانات التقويم للمريض بنجاح.`;
                    }
                    break;
                case 'addLabOrder':
                    if(setPatients && setExpenses) {
                        const newOrder = {id: Date.now().toString(), type: actionData.type, units: actionData.units, labName: actionData.labName, price: actionData.price, startDate: today, deliveryDate: actionData.deliveryDate || today, status: 'pending'};
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? { ...p, labOrders: [newOrder, ...(p.labOrders||[])] } : p));
                        setExpenses(prev => [{id: Date.now().toString()+'_lab', description: `معمل (${actionData.labName}) - مريض: ${actionData.patientName}`, amount: Number(actionData.price), date: today}, ...prev]);
                        actionMsg = `✅ تم طلب التركيبة من المعمل وتسجيلها في المصروفات.`;

                    break;
                case 'updateLabStatus':
                    if(setPatients) {
                        setPatients(prev => prev.map(p => p.name.includes(actionData.patientName) ? { ...p, labOrders: p.labOrders.map(o => o.id === actionData.labOrderId || o.type.includes(actionData.labOrderType) ? {...o, status: actionData.status, deliveredOn: today} : o) } : p));
                        actionMsg = `✅ تم تحديث حالة تركيبة المعمل إلى: ${actionData.status}.`;
                    }
                    break;
                case 'buyMaterials':
                    if(setInventory && setExpenses) {
                        if(actionData.materials) {
                            const newMats = actionData.materials.map(m => ({ id: Date.now().toString() + Math.random(), name: m.name + ' (AI)', stock: Number(m.stock), unitCost: Number(m.unitCost).toFixed(2) }));
                            setInventory(prev => [...newMats, ...prev]);
                        }

                        actionMsg = `✅ تم إضافة الخامات للمخزن وتسجيل الفاتورة.`;

                                setLogs(prev => [{ id: Date.now().toString() + Math.random(), date: today, patientId: findPatient(actionData.patientName)?.id, type: 'material', itemName: item.name, qty: item.qty }, ...prev]);

                                setLogs(prev => [{ id: Date.now().toString() + Math.random(), date: today, patientId: findPatient(actionData.patientName)?.id, type: 'instrument', itemName: item.name, qty: item.qty, status: 'dirty' }, ...prev]);
                                loggedCount++;
                            });
                        }
                        actionMsg = `✅ تم تسجيل استهلاك الجلسة (${loggedCount} أصناف) وخصمها من المخزن والآلات النظيفة.`;
                    }
                    break;
                case 'updateSchedule':
                    const savedSchedule = JSON.parse(localStorage.getItem('smile_schedule_settings') || '{}');
                    if (actionData.action === 'addHoliday') savedSchedule.holidayDates = [...(savedSchedule.holidayDates || []), actionData.date];
                    else if (actionData.action === 'changeHours') { savedSchedule.startHour = actionData.start; savedSchedule.endHour = actionData.end; }
                    localStorage.setItem('smile_schedule_settings', JSON.stringify(savedSchedule));
                    actionMsg = `✅ تم تحديث إعدادات الأجندة بنجاح (سيتم تطبيقها فوراً).`;
                    break;
                case 'saveMediaToPatient':
                    if(setPatients && currentAttachments.length > 0) {
                        const pat = findPatient(actionData.patientName);
                        if(pat) {
                            const savedGoogleConfig = loadData('smile_clinic_google_v12', {});
                            const appsScriptUrl = savedGoogleConfig.appsScriptUrl;
                            let successCount = 0;
                            let newMediaItems = [];

                            for (let i = 0; i < currentAttachments.length; i++) {
                                const att = currentAttachments[i];
                                const isImage = att.type.startsWith('image/');
                                const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).substr(2, 5);
                                
                                if (appsScriptUrl) {
                                    let base64DataOnly = att.base64.includes(',') ? att.base64.split(',')[1] : att.base64;
                                    const uniqueFileName = `${Date.now()}_AI_${att.name || 'file'}`;
                                    const payload = { action: 'uploadMedia', patientName: pat.name, filename: uniqueFileName, mimeType: att.type || 'image/jpeg', base64Data: base64DataOnly };
                                    
                                    try {
                                        const response = await fetch(appsScriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                                        const result = await response.json();
                                        
                                        if (result.status === 'success') {
                                            newMediaItems.push({
                                                id: uniqueId, type: 'photo', phase: actionData.phase || 'before', 
                                                url: result.url, date: today, isImage: isImage, fileName: uniqueFileName, base64: '' 
                                            });
                                            successCount++;
                                        }
                                    } catch(err) { console.error("Drive upload error from AI", err); }
                                } else {
                                    newMediaItems.push({
                                        id: uniqueId, type: 'photo', phase: actionData.phase || 'before', 
                                        base64: att.base64, date: today, isImage: isImage, fileName: att.name
                                    });
                                }

                            if (newMediaItems.length > 0) {

                                actionMsg = appsScriptUrl 
                                    ? `✅ تم رفع وحفظ (${successCount}) ملف في جوجل درايف وإضافتها لملف المريض (${pat.name}) بنجاح.`
                                    : `✅ تم حفظ الصور محلياً لملف المريض (${pat.name}). برجاء إضافة الرابط السحري للرفع على درايف.`;

                                actionMsg = `❌ حدث خطأ أثناء الرفع لجوجل درايف.`;

                            actionMsg = `❌ لم أتمكن من العثور على مريض بهذا الاسم.`;

                    } else {
                        actionMsg = `❌ لم يتم إرفاق صور لحفظها.`;

case 'attachPatientMedia':

                            const newAttachments = [];
                            for (let m of filteredToAttach) {
                                let finalBase64 = m.base64;
                                if (!finalBase64 && m.url && m.url.includes('drive.google.com') && googleConfig.appsScriptUrl) {
                                    try {
                                        let fileId = m.url.includes('id=') ? m.url.split('id=')[1].split('&')[0] : (m.url.includes('/d/') ? m.url.split('/d/')[1].split('/')[0] : null);
                                        if (fileId) {
                                            const response = await fetch(googleConfig.appsScriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'fetchDriveFileBase64', fileId: fileId }) });
                                            const result = await response.json();
                                            if (result.status === 'success') finalBase64 = `data:${result.mimeType};base64,${result.base64}`;
                                        }
                                    } catch(e) { console.log("خطأ في جلب الصورة", e); }
                                }
                                
                                if (finalBase64) {
                                    newAttachments.push({
                                        id: Date.now() + Math.random(),
                                        name: m.fileName || 'صورة_مريض.jpg',
                                        type: m.isImage !== false ? 'image/jpeg' : 'application/pdf',
                                        base64: finalBase64
                                    });
                                }
                            }
                            
                            if (setAttachments && newAttachments.length > 0) {
                                setAttachments(prev => [...prev, ...newAttachments]);
                            } else if (newAttachments.length === 0) {
                                actionMsg = `❌ تعذر سحب الصور، قد تحتاج لجلبها من درايف أولاً من ملف المريض.`;

                    } else {

                    }
                    break;


                case 'showPatientMedia':
                    const patMedia = findPatient(actionData.patientName);
                    if (patMedia && patMedia.media && patMedia.media.length > 0) {
                        let filtered = patMedia.media;
                        if (actionData.phase && actionData.phase !== 'all') {

                            }));

                        }
                    } else {
                        actionMsg = `❌ لا توجد أي صور أو أشعة مسجلة في ملف هذا المريض.`;
                    }
                    break;
            }
        } catch(e) { console.error("Action Exec Error", e); }
        
        return actionAttachments ? { text: actionMsg, attachments: actionAttachments } : actionMsg;
    };

const DentalChart = ({ patientId, chartData, onUpdateChart }) => {
            const [dentition, setDentition] = useState('adult'); // adult, child, mixed
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, toothNum: null, displayNum: null });
            const [entryType, setEntryType] = useState('planned'); 
            const [editItemId, setEditItemId] = useState(null);
            
            const [plannedProblem, setPlannedProblem] = useState('');
            const [plannedNeeded, setPlannedNeeded] = useState('');
            const [plannedSurface, setPlannedSurface] = useState('كامل السن');
            
            const [completedProc, setCompletedProc] = useState('');
            const [completedPrice, setCompletedPrice] = useState('');
            const [completedSurface, setCompletedSurface] = useState('كامل السن');
            
            const [entryDate, setEntryDate] = useState(new Date().toISOString().split('T')[0]);

            const commonProblems = ['تسوس', 'عصب ملتهب', 'بقايا جذور', 'فقدان سن', 'جير/التهاب لثة', 'كسر بالسن'];
            const commonTreatments = ['حشو عادي', 'علاج جذور', 'خلع', 'تركيبات (تاج/جسر)', 'زراعة', 'تنظيف جير'];
            const toothSurfaces = ['كامل السن', 'طاحن (O)', 'وسطي (M)', 'بعيد (D)', 'خارجي (B/F)', 'داخلي (L/P)'];

            const getToothStatus = (toothNum) => {
                const entries = chartData.filter(d => d.toothNum === toothNum);
                const hasProblem = entries.some(e => e.type === 'planned');
                const hasCompleted = entries.some(e => e.type === 'completed');
                return { hasProblem, hasCompleted, entries };
            };

            const handleOpenModal = (fdiNum, displayNum) => {
                setModal({ isOpen: true, toothNum: fdiNum, displayNum: displayNum });
                setEntryType('planned');
                setEditItemId(null);
                setPlannedProblem(''); setPlannedNeeded(''); setPlannedSurface('كامل السن');
                setCompletedProc(''); setCompletedPrice(''); setCompletedSurface('كامل السن');
                setEntryDate(new Date().toISOString().split('T')[0]);
            };

            const handleEdit = (item) => {
                setEntryType(item.type);
                setEditItemId(item.id);
                setEntryDate(item.date || new Date().toISOString().split('T')[0]);
                
                const extractSurface = (desc) => {
                    const match = desc.match(/\[(.*?)\]/);
                    if (match) return { cleanDesc: desc.replace(` [${match[1]}]`, ''), surface: match[1] };
                    return { cleanDesc: desc, surface: 'كامل السن' };
                };

                const extracted = extractSurface(item.desc);
                
                if(item.type === 'planned') {
                    setPlannedProblem(extracted.cleanDesc);
                    setPlannedSurface(extracted.surface);
                    setPlannedNeeded(item.needed || '');
                } else {
                    setCompletedProc(extracted.cleanDesc);
                    setCompletedSurface(extracted.surface);
                    setCompletedPrice(item.price || '');
                }
            };

            const handleSave = () => {
                if (entryType === 'planned' && !plannedProblem) return;
                if (entryType === 'completed' && !completedProc) return;

                const surfaceSuffix = entryType === 'planned' ? 
                    (plannedSurface !== 'كامل السن' ? ` [${plannedSurface}]` : '') : 
                    (completedSurface !== 'كامل السن' ? ` [${completedSurface}]` : '');

                if (editItemId) {
                    onUpdateChart({ id: editItemId, delete: true });
                }

                const newItem = { 
                    id: editItemId || Date.now().toString(), 
                    toothNum: modal.toothNum, 
                    displayNum: modal.displayNum,
                    type: entryType, 
                    date: entryDate 
                };

                if (entryType === 'planned') {
                    newItem.desc = plannedProblem + surfaceSuffix;
                    newItem.needed = plannedNeeded;
                } else {
                    newItem.desc = completedProc + surfaceSuffix;
                    newItem.price = completedPrice || 0;
                }

                onUpdateChart(newItem);
                setModal({ isOpen: false, toothNum: null, displayNum: null });
            };

            const handleDelete = (itemId) => {
                onUpdateChart({ id: itemId, delete: true });
            };

            const handleSmartDiagnosis = async (e) => {
                const files = Array.from(e.target.files);
                if(files.length === 0) return;
                setIsAiLoading(true);
                try {
                    const apiKey = loadData('smile_clinic_google_v12', {}).geminiApiKey || "API_KEY";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
                    
                    const imageParts = await Promise.all(files.map(async file => {
                        return new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve({ inlineData: { mimeType: file.type || 'image/jpeg', data: ev.target.result.split(',')[1] } });
                            reader.readAsDataURL(file);
                        });
                    }));
                    
                    const prompt = `أنت طبيب أسنان استشاري. قم بتحليل هذه الصور والأشعة واستخراج المشاكل (مثل التسوس، بقايا جذور، التهابات) والإجراءات والتركيبات السابقة (مثل الحشوات، الزرعات، التيجان). 
                    أرجع الناتج كـ JSON Array فقط بهذا التنسيق وبدون أي نصوص إضافية أو علامات Markdown:
                    [
                      {"fdiNum": 16, "displayNum": "6", "type": "planned", "desc": "تسوس عميق", "needed": "حشو عصب"},
                      {"fdiNum": 46, "displayNum": "6", "type": "completed", "desc": "زراعة أسنان", "price": 0}
                    ]
                    تأكد من استخدام رقم fdiNum الصحيح للأسنان الدائمة أو اللبنية حسب ما تراه في الصورة.`;

                    const payload = { contents: [{ parts: [{ text: prompt }, ...imageParts] }] };
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    
                    if (result.candidates) {
                        let jsonStr = result.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                        const items = JSON.parse(jsonStr);
                        
                        items.forEach(item => {
                            onUpdateChart({
                                id: Date.now().toString() + Math.random(),
                                toothNum: item.fdiNum,
                                displayNum: item.displayNum,
                                type: item.type,
                                desc: item.desc + ' (AI)',
                                needed: item.needed || '',
                                price: item.price || 0,
                                date: new Date().toISOString().split('T')[0]
                            });
                        });
                        alert('تم تحليل الصور وإضافة التشخيص للخريطة بنجاح!');
                    }
                } catch (e) {
                    alert('حدث خطأ في التشخيص الذكي. تأكد من جودة الصور واتصالك بالإنترنت.');
                } finally {
                    setIsAiLoading(false);
                    e.target.value = null;
                }
            };

            const ToothIcon = ({ n, hasProblem, hasCompleted }) => {
                const colorClass = hasProblem && hasCompleted ? "text-yellow-500" : hasProblem ? "text-red-500" : hasCompleted ? "text-green-500" : "text-brand-navy/20 group-hover:text-brand-navy/40";
                const isAnterior = (typeof n === 'number' && n <= 3) || (typeof n === 'string' && ['A','B','C'].includes(n));
                const isPremolar = (typeof n === 'number' && n <= 5 && n > 3) || (typeof n === 'string' && ['D'].includes(n));
                
                if (isAnterior) { 
                    return <svg className={`w-4 h-6 ${colorClass} transition-colors duration-200`} viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8c2 0 3 2 3 6v6c0 4-2 8-5 8h-4c-3 0-5-4-5-8V8c0-4 1-6 3-6z"/></svg>;
                } else if (isPremolar) { 
                    return <svg className={`w-5 h-6 ${colorClass} transition-colors duration-200`} viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12c2 0 3 2 3 6v4c0 3-1 6-3 8v2h-4v-2c-1 0-2 0.5-2 0.5s-1-0.5-2-0.5v2H6v-2c-2-2-3-5-3-8V8c0-4 1-6 3-6z"/></svg>;
                } else { 
                    return <svg className={`w-6 h-6 ${colorClass} transition-colors duration-200`} viewBox="0 0 24 24" fill="currentColor"><path d="M4 2h16c2 0 2 2 2 6v4c0 3-1 5-2 6v4h-4v-3c-1.5 1-2.5 1-4 1s-2.5 0-4-1v3H4v-4C3 17 2 15 2 12V8c0-4 0-6 2-6z"/></svg>;
                }
            };

            const renderTooth = (fdiNum, displayNum, arch) => {
                const { hasProblem, hasCompleted } = getToothStatus(fdiNum);
                let bgClass = "bg-white border-slate-200 hover:border-brand-navy";
                if(hasProblem && hasCompleted) bgClass = "bg-yellow-50 border-yellow-400";
                else if(hasProblem) bgClass = "bg-red-50 border-red-400";
                else if(hasCompleted) bgClass = "bg-green-50 border-green-400";

                const shapeClass = arch === 'upper' ? "tooth-upper" : "tooth-lower";

                return (
                    <div key={fdiNum} onClick={() => handleOpenModal(fdiNum, displayNum)} className={`w-8 h-14 md:w-10 md:h-16 flex flex-col items-center justify-center border-2 tooth-box shadow-sm shrink-0 group ${bgClass} ${shapeClass}`}>
                        {arch === 'lower' && <div className="rotate-0"><ToothIcon n={displayNum} hasProblem={hasProblem} hasCompleted={hasCompleted} /></div>}
                        <span className={`font-black text-slate-700 text-xs md:text-sm ${arch === 'upper' ? 'mb-1' : 'mt-1'}`}>{displayNum}</span>
                        {arch === 'upper' && <div className="rotate-180"><ToothIcon n={displayNum} hasProblem={hasProblem} hasCompleted={hasCompleted} /></div>}
                    </div>
                );
            };

            const renderArchRow = (type, archType) => {
                const isUpper = archType === 'upper';
                const nums = type === 'adult' ? [8,7,6,5,4,3,2,1] : [5,4,3,2,1];
                const rightPrefix = type === 'adult' ? (isUpper ? 10 : 40) : (isUpper ? 50 : 80);
                const leftPrefix = type === 'adult' ? (isUpper ? 20 : 30) : (isUpper ? 60 : 70);
                const childLabels = {1:'A', 2:'B', 3:'C', 4:'D', 5:'E'};
                
                return (
                    <div className="flex justify-center gap-1 mb-1">
                        <div className="flex gap-1 border-r-2 border-slate-300 pr-1">
                            {nums.map(n => renderTooth(rightPrefix + n, type === 'adult' ? n : childLabels[n], archType))}
                        </div>
                        <div className="flex gap-1 pl-1">
                            {nums.slice().reverse().map(n => renderTooth(leftPrefix + n, type === 'adult' ? n : childLabels[n], archType))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-4 border-b pb-3 gap-3">
                        <h3 className="font-bold text-slate-800 flex items-center gap-2">
                            <i className="fa-solid fa-teeth text-brand-navy"></i> الخريطة السنية التفاعلية
                        </h3>
                        <div className="flex gap-2">
                            <label className="bg-brand-navy hover:bg-brand-blue text-brand-gold px-4 py-2 rounded-lg text-xs font-bold cursor-pointer transition-colors shadow-sm flex items-center gap-2">
                                {isAiLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-camera"></i>} تشخيص ذكي (AI)
                                <input type="file" multiple accept="image/*" capture="environment" onChange={handleSmartDiagnosis} className="hidden" />
                            </label>
                        </div>
                    </div>
                    
                    <div className="flex gap-2 justify-center mb-6 bg-slate-100 p-1.5 rounded-xl w-max mx-auto shadow-inner">
                        <button onClick={()=>setDentition('adult')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors ${dentition === 'adult' ? 'bg-brand-navy text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>أسنان دائمة</button>
                        <button onClick={()=>setDentition('child')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors ${dentition === 'child' ? 'bg-brand-navy text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>أطفال</button>
                        <button onClick={()=>setDentition('mixed')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors ${dentition === 'mixed' ? 'bg-brand-navy text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>مختلط (Mixed)</button>
                    </div>

                    <div className="overflow-x-auto hide-scroll pb-4" dir="ltr">
                        <div className="flex flex-col gap-1 min-w-[650px] items-center">
                            {(dentition === 'adult' || dentition === 'mixed') && renderArchRow('adult', 'upper')}
                            {(dentition === 'child' || dentition === 'mixed') && renderArchRow('child', 'upper')}
                            
                            <div className="h-1 w-full max-w-2xl bg-slate-200 rounded-full my-2"></div>
                            
                            {(dentition === 'child' || dentition === 'mixed') && renderArchRow('child', 'lower')}
                            {(dentition === 'adult' || dentition === 'mixed') && renderArchRow('adult', 'lower')}
                        </div>
                    </div>
                    
                    <div className="flex justify-center gap-4 text-xs font-bold text-slate-600 mt-2">
                        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-red-500 rounded-full"></div> مشكلة / مطلوب</span>
                        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-green-500 rounded-full"></div> إجراء تم</span>
                    </div>

                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" dir="rtl">
                            <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h4 className="font-bold text-brand-navy">إدارة حالة السن رقم ({modal.displayNum})</h4>
                                    <button onClick={()=>setModal({isOpen:false, toothNum:null, displayNum:null})} className="text-slate-400 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                                </div>

                                <div className="space-y-4 mb-4">
                                    <div className="flex bg-slate-100 p-1 rounded-lg text-sm font-bold">
                                        <button onClick={()=>setEntryType('completed')} className={`flex-1 py-2 rounded-md transition-colors ${entryType === 'completed' ? 'bg-green-500 text-white shadow' : 'text-slate-600'}`}>ما تم عمله بالعيادة</button>
                                        <button onClick={()=>setEntryType('planned')} className={`flex-1 py-2 rounded-md transition-colors ${entryType === 'planned' ? 'bg-red-500 text-white shadow' : 'text-slate-600'}`}>مشكلة / خطة مطلوبة</button>
                                    </div>

                                    {entryType === 'completed' ? (
                                        <div className="space-y-3 animate-fade-in border border-green-200 bg-green-50 p-3 rounded-xl">
                                            <div>
                                                <label className="text-xs font-bold text-green-800 mb-1 block">الإجراء الذي تم تنفيذه *</label>
                                                <input type="text" placeholder="مثال: حشو كمبوزت، علاج جذور..." value={completedProc} onChange={e=>setCompletedProc(e.target.value)} className="w-full border border-green-300 p-2.5 rounded-lg text-sm outline-none bg-white" />
                                                <div className="flex flex-wrap gap-1 mt-2">
                                                    {commonTreatments.map(t => <button key={t} onClick={()=>setCompletedProc(t)} className="bg-white border border-green-200 text-green-700 text-[10px] px-2 py-1 rounded hover:bg-green-100">{t}</button>)}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-green-800 mb-1 block">مكان الإجراء بالسنة (السطح)</label>
                                                <select value={completedSurface} onChange={e=>setCompletedSurface(e.target.value)} className="w-full border border-green-300 p-2.5 rounded-lg text-sm outline-none bg-white font-bold text-green-900">
                                                    {toothSurfaces.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                            <div className="flex gap-2">
                                                <div className="flex-1">
                                                    <label className="text-xs font-bold text-green-800 mb-1 block">ثمن الإجراء (ج.م)</label>
                                                    <input type="number" placeholder="سعر الإجراء" value={completedPrice} onChange={e=>setCompletedPrice(e.target.value)} className="w-full border border-green-300 p-2.5 rounded-lg text-sm outline-none bg-white font-bold" />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="text-xs font-bold text-green-800 mb-1 block">تاريخ الإجراء</label>
                                                    <input type="date" value={entryDate} onChange={e=>setEntryDate(e.target.value)} className="w-full border border-green-300 p-2.5 rounded-lg text-sm outline-none bg-white" />
                                                </div>
                                            </div>
                                            <p className="text-[10px] text-green-700 font-bold mt-1"><i className="fa-solid fa-info-circle"></i> سيتم إضافة هذا الإجراء وثمنه تلقائياً لجدول (الإجراءات المنفذة) في حسابات المريض.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 animate-fade-in border border-red-200 bg-red-50 p-3 rounded-xl">
                                            <div>
                                                <label className="text-xs font-bold text-red-800 mb-1 block">المشكلة الموجودة *</label>
                                                <input type="text" placeholder="مثال: تسوس عميق، بقايا جذور..." value={plannedProblem} onChange={e=>setPlannedProblem(e.target.value)} className="w-full border border-red-300 p-2.5 rounded-lg text-sm outline-none bg-white" />
                                                <div className="flex flex-wrap gap-1 mt-2">
                                                    {commonProblems.map(p => <button key={p} onClick={()=>setPlannedProblem(p)} className="bg-white border border-red-200 text-red-700 text-[10px] px-2 py-1 rounded hover:bg-red-100">{p}</button>)}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-red-800 mb-1 block">مكان المشكلة بالسنة (السطح)</label>
                                                <select value={plannedSurface} onChange={e=>setPlannedSurface(e.target.value)} className="w-full border border-red-300 p-2.5 rounded-lg text-sm outline-none bg-white font-bold text-red-900">
                                                    {toothSurfaces.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-red-800 mb-1 block">ما يحتاجه المريض لحل المشكلة (خطة العلاج)</label>
                                                <input type="text" placeholder="مثال: حشو عصب + تاج..." value={plannedNeeded} onChange={e=>setPlannedNeeded(e.target.value)} className="w-full border border-red-300 p-2.5 rounded-lg text-sm outline-none bg-white" />
                                                <div className="flex flex-wrap gap-1 mt-2">
                                                    {commonTreatments.map(t => <button key={t} onClick={()=>setPlannedNeeded(t)} className="bg-white border border-red-200 text-red-700 text-[10px] px-2 py-1 rounded hover:bg-red-100">{t}</button>)}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-red-800 mb-1 block">تاريخ التسجيل</label>
                                                <input type="date" value={entryDate} onChange={e=>setEntryDate(e.target.value)} className="w-full border border-red-300 p-2.5 rounded-lg text-sm outline-none bg-white" />
                                            </div>
                                        </div>
                                    )}

                                    <button onClick={handleSave} className="w-full bg-brand-navy text-brand-gold py-3 rounded-xl font-bold text-sm shadow-md hover:bg-brand-blue transition-colors">
                                        {editItemId ? 'تحديث السجل' : 'حفظ بالخريطة السنية'}
                                    </button>
                                </div>

                                <div className="space-y-2 max-h-40 overflow-y-auto">
                                    {getToothStatus(modal.toothNum).entries.length > 0 && <p className="text-xs font-bold text-slate-500 mb-2">السجل السابق للسن:</p>}
                                    {getToothStatus(modal.toothNum).entries.map(e => (
                                        <div key={e.id} className={`p-3 rounded-xl flex justify-between items-center text-xs border shadow-sm ${e.type === 'planned' ? 'bg-white border-red-200' : 'bg-white border-green-200'}`}>
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold text-white ${e.type === 'planned' ? 'bg-red-500' : 'bg-green-500'}`}>{e.type === 'planned' ? 'مشكلة' : 'تم العمل'}</span>
                                                    <span className="text-slate-500">{e.date}</span>
                                                </div>
                                                <span className={`font-bold text-sm block ${e.type === 'planned' ? 'text-red-700' : 'text-green-700'}`}>{e.desc}</span>
                                            </div>
                                            <div className="flex gap-1 ml-2">
                                                <button onClick={()=>handleEdit(e)} className="text-blue-500 hover:text-blue-700 p-2 bg-slate-50 rounded-lg"><i className="fa-solid fa-pen"></i></button>
                                                <button onClick={()=>handleDelete(e.id)} className="text-red-400 hover:text-red-600 p-2 bg-slate-50 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

const PatientDetails = ({ 
    activePatientId, patients, setPatients, appointments, setAppointments, inventory, instruments, 
    logs, setLogs, selectedDate, setCurrentView, showMessage, showConfirm, logSessionUsage, setExpenses, setInventory, setInstruments, chatSettings, userRole 
}) => {

    const patient = patients.find(p => p.id === activePatientId);
    if (!patient) return null;

    const totalCost = getPatientTotalCost(patient);
    const totalPaid = getPatientTotalPaid(patient);
    const remaining = totalCost - totalPaid;
    
    const [patientTab, setPatientTab] = useState('info'); 

    const [newProc, setNewProc] = useState({ name: '', price: '', date: selectedDate, notes: '' });
    const [newPayment, setNewPayment] = useState({ amount: '', date: selectedDate });
    const [newPlan, setNewPlan] = useState({ description: '', dateAdded: selectedDate });
    const [newRx, setNewRx] = useState({ details: '', date: selectedDate });
const [showHiddenMedia, setShowHiddenMedia] = useState(false);
const [selectedMediaIds, setSelectedMediaIds] = useState([]);
useEffect(() => { setSelectedMediaIds([]); }, [patient.id, patientTab]); // لتفريغ التحديد عند تغيير المريض
const [isAiRxLoading, setIsAiRxLoading] = useState(false);
const [isAiPlanLoading, setIsAiPlanLoading] = useState(false);
const [aiQuery, setAiQuery] = useState('');
const [aiResponse, setAiResponse] = useState('');
const [editingAiAnalysisId, setEditingAiAnalysisId] = useState(null);
const [editAiAnalysisContent, setEditAiAnalysisContent] = useState('');
const [isAiLoading, setIsAiLoading] = useState(false);
// === متغيرات الذكاء الاصطناعي الأساسية والذاكرة المؤقتة ===
    const [selectedAiMediaIds, setSelectedAiMediaIds] = useState([]);
    const [localAiFiles, setLocalAiFiles] = useState([]);
    const [aiTempDriveImages, setAiTempDriveImages] = useState({});
    const [loadingMediaIds, setLoadingMediaIds] = useState([]); 

    // (تدمير ذاتي) مسح الذاكرة عند الخروج من تبويب الذكاء الاصطناعي
    useEffect(() => {
        if (patientTab !== 'ai_analysis') {
            setAiTempDriveImages({});
            setLocalAiFiles([]);
            setSelectedAiMediaIds([]);
        }
    }, [patientTab]);

    // === دالة 1: سحب الصورة من درايف وضغطها في المتصفح ===
    const toggleAiMediaSelection = async (media) => {
        const isSelected = selectedAiMediaIds.includes(media.id);
        if (isSelected) {

            setSelectedAiMediaIds(prev => [...prev, media.id]);
            return;
        }

        let fileId = media.url.includes('id=') ? media.url.split('id=')[1].split('&')[0] : (media.url.includes('/d/') ? media.url.split('/d/')[1].split('/')[0] : null);

            });
            const result = await response.json();
            
            if (result.status === 'success') {
                const img = new Image();
                img.src = `data:${result.mimeType};base64,${result.base64}`;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5); 
                    
                    setAiTempDriveImages(prev => ({ ...prev, [media.id]: compressedBase64 }));
                    setSelectedAiMediaIds(prev => [...prev, media.id]); 
                };
            } else {
                alert('تعذر سحب الصورة من درايف.');
            }
        } catch (e) {

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setLocalAiFiles(prev => [...prev, { id: Date.now() + Math.random(), fileName: file.name, base64: canvas.toDataURL('image/jpeg', 0.5), isImage: true }]);
                    }
                };
            } else if (file.type === 'application/pdf') {
                if (file.size > 5 * 1024 * 1024) return alert('ملف الـ PDF كبير جداً.');

                reader.readAsDataURL(file);
                reader.onload = (event) => {

    const handleUpdatePatientLog = (logId, newQty) => {
        const qty = Number(newQty);
        if (qty < 0) return;
        const log = logs.find(l => l.id === logId);
        if (!log) return;
        const qtyDiff = qty - log.qty;
        if (log.type === 'material') {
            const item = inventory.find(i => i.id === log.itemId);
            if(item && item.stock < qtyDiff) return showMessage('تنبيه', 'الرصيد في المخزن لا يكفي لهذه الزيادة.');
            if (item) setInventory(prev => prev.map(i => i.id === item.id ? { ...i, stock: i.stock - qtyDiff } : i));
            setLogs(prev => prev.map(l => l.id === logId ? { ...l, qty: qty, cost: (item ? item.unitCost * qty : 0) } : l));
        } else {
            const item = instruments.find(i => i.id === log.itemId);
            if(item && item.clean < qtyDiff) return showMessage('تنبيه', 'الآلات النظيفة لا تكفي.');
            if (item) setInstruments(prev => prev.map(i => i.id === item.id ? { ...i, clean: i.clean - qtyDiff, dirty: i.dirty + qtyDiff } : i));
            setLogs(prev => prev.map(l => l.id === logId ? { ...l, qty: qty } : l));
        }
    };

    const handleDeletePatientLog = (logId) => {
        showConfirm('حذف استهلاك', 'هل أنت متأكد من مسح هذا الاستهلاك وإرجاع الكمية للمخزن؟', () => {
            const log = logs.find(l => l.id === logId);
            if (!log) return;
            if (log.type === 'material') { setInventory(prev => prev.map(i => i.id === log.itemId ? { ...i, stock: i.stock + log.qty } : i)); } 
            else { setInstruments(prev => prev.map(i => i.id === log.itemId ? { ...i, clean: i.clean + log.qty, dirty: i.dirty - log.qty } : i)); }

const handleFileUpload = async (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            const googleConfig = loadData('smile_clinic_google_v12', { appsScriptUrl: '' });
            if (!googleConfig.appsScriptUrl) { 
                e.target.value = null; 
                return showMessage('تنبيه', 'برجاء إضافة الرابط السحري في الإعدادات أولاً.'); 
            }

            showMessage('جاري الرفع...', `يتم الآن معالجة ورفع الملفات، برجاء الانتظار...`);

            let successCount = 0;
            let errorMsg = '';

            for (const file of files) {
                const isImage = file.type.startsWith('image/');
                const fileName = file.name || 'file';
                
                // تم إزالة قيد الحجم تماماً للصور بناءً على طلبك
                // في حالة ملفات PDF الضخمة جداً فقط (أكبر من 15 ميجا) نكتفي بإعطاء تنبيه
                if (!isImage && file.size > 15 * 1024 * 1024) {
                    errorMsg = `ملف الـ PDF "${fileName}" حجمه ضخم وقد يستغرق وقتاً طويلاً للرفع.`;
                }

                // 1. معالجة وضغط الصورة لتسريع الرفع (مهما كان الحجم الأصلي)
                const getBase64 = () => new Promise((resolve) => {
                    if (isImage) compressImage(file, resolve);
                    else {
                        const reader = new FileReader();
                        reader.onload = (ev) => resolve(ev.target.result);
                        reader.readAsDataURL(file);
                    }
                });

                const finalBase64 = await getBase64();
                if (!finalBase64) continue;

                // 2. الرفع المباشر لجوجل درايف
                const mimeType = file.type || 'application/octet-stream';
                let base64DataOnly = finalBase64.includes(',') ? finalBase64.split(',')[1] : finalBase64;
                const uniqueFileName = `${Date.now()}_${Math.floor(Math.random()*1000)}_${fileName}`;
                const payload = { action: 'uploadMedia', patientName: patient.name || 'مريض', filename: uniqueFileName, mimeType: mimeType, base64Data: base64DataOnly };
                
                try {
                    const response = await fetch(googleConfig.appsScriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        // 3. الحفظ النظيف: حفظ رابط جوجل فقط بدون الكود الثقيل
                        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).substr(2, 5);
                        setPatients(prevPatients => prevPatients.map(p => {
                            if (p.id === patient.id) {
                                const newItem = {
                                    id: uniqueId, 
                                    type: newMedia.type || 'photo', 
                                    phase: newMedia.phase || 'before', 
                                    url: result.url, 
                                    date: selectedDate, 
                                    isImage: isImage, 
                                    fileName: fileName, 
                                    base64: '' 
                                };
                                return { ...p, media: [newItem, ...(p.media || [])] };
                            }
                            return p;
                        }));
                        successCount++;
                    } else {
                        errorMsg = 'فشل الرفع لدرايف: ' + result.message;
                    }
                } catch (error) { 
                    console.error("خطأ في الرفع", error);
                    errorMsg = 'حدث خطأ في الاتصال بالإنترنت أثناء الرفع.';
                }
            }
            
            e.target.value = null; 
            
            // 4. إغلاق شاشة (جاري الرفع) وإظهار النتيجة
            if (successCount > 0) {
                showMessage('نجاح', `تم رفع وحفظ ${successCount} ملف بنجاح! ${errorMsg ? '\n\nملاحظة: ' + errorMsg : ''}`);
            } else if (errorMsg) {
                showMessage('تنبيه', errorMsg);
            } else {
                setModalConfig({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null });
            }
        };

// === دالة سحب صورة الحالة إلى مربع الصور الخارجية (التحليل الذكي) ===
    const handleMoveToExternal = async (media) => {
        // منع سحب نفس الصورة مرتين لنفس المربع
        if (localAiFiles.some(f => f.originalId === media.id)) {
            return showMessage('تنبيه', 'تم سحب هذه الصورة بالفعل إلى مربع التحليل بالأسفل.');
        }

        // 1. لو الصورة موجودة كـ Base64 مباشر في البرنامج
        if (media.base64 && media.base64.length > 100) {
            setLocalAiFiles(prev => [...prev, { id: Date.now() + Math.random(), originalId: media.id, fileName: media.fileName || 'صورة.jpg', base64: media.base64, isImage: media.isImage !== false }]);
            return;
        }
        
        // 2. لو الصورة مرفوعة على درايف، نجيب الـ ID بتاعها
        let fileId = media.url?.includes('id=') ? media.url.split('id=')[1].split('&')[0] : (media.url?.includes('/d/') ? media.url.split('/d/')[1].split('/')[0] : null);
        if (!fileId) return showMessage('تنبيه', 'لا يمكن قراءة مسار الصورة، يرجى رفعها يدوياً.');

        setLoadingMediaIds(prev => [...prev, media.id]); // تشغيل علامة التحميل (Spinner) على الصورة اللي دوست عليها
        try {
            const googleConfig = loadData('smile_clinic_google_v12', {});
            const response = await fetch(googleConfig.appsScriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'fetchDriveFileBase64', fileId: fileId })
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                const img = new Image();
                img.src = `data:${result.mimeType};base64,${result.base64}`;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    // ضغط الصورة عشان متعملش زحمة في الذاكرة أثناء التحليل
                    if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5); 
                    
                    // إضافتها لمربع الصور الخارجية تحت
                    setLocalAiFiles(prev => [...prev, { id: Date.now() + Math.random(), originalId: media.id, fileName: media.fileName || 'صورة_مسحوبة.jpg', base64: compressedBase64, isImage: media.isImage !== false }]);
                };
            } else {
                showMessage('خطأ', 'تعذر سحب الصورة من درايف.');
            }
        } catch (e) {
            showMessage('خطأ', 'تأكد من اتصال الإنترنت.');
        } finally {
            setLoadingMediaIds(prev => prev.filter(id => id !== media.id)); // إيقاف علامة التحميل
        }
    };

const bookAppointment = (time, patientId, durationInMins, specificDate = selectedDate) => {
    if (!patientId || !durationInMins) return showMessage('تنبيه', 'برجاء استكمال بيانات الحجز');
    const startMins = timeToMins(time), endMins = startMins + Number(durationInMins);
    const isOverlap = appointments.filter(a => a.date === specificDate).some(a => { const aStart = timeToMins(a.time), aEnd = aStart + Number(a.duration || 30); return startMins < aEnd && endMins > aStart; });
    if (isOverlap) return showMessage('تنبيه', 'هذا الوقت يتداخل مع حجز آخر!');
    
    const newAppt = { id: Date.now().toString(), patientId, date: specificDate, time, duration: Number(durationInMins) };
    
    // المزامنة مع جوجل كاليندر
    if (googleConfig.appsScriptUrl) {
        syncEventToGoogleCalendar(newAppt, patient, googleConfig.appsScriptUrl, selectedDoctorCal).then(res => { 
            if(res.success) showMessage('نجاح', 'تم تسجيل الموعد بنجاح في العيادة وجوجل كاليندر!');
            else showMessage('تنبيه', 'تم الحجز محلياً ولكن فشل الربط مع جوجل: ' + res.message);
        });
    } else {
        showMessage('نجاح', 'تم الحجز في العيادة بنجاح!');
    }
    
    setAppointments(prev => [...prev, newAppt]);
};

const AppointmentsView = ({ selectedDate, setSelectedDate, appointments, setAppointments, patients, showMessage, showConfirm }) => {

// إعدادات مواعيد العيادة (محفوظة في اللوكال ستوريدج)
const [clinicSchedule, setClinicSchedule] = useState(() => {
    const saved = localStorage.getItem('smile_schedule_settings');
    const parsed = saved ? JSON.parse(saved) : {};
    return { 
        startHour: parsed.startHour || '12:00',
        endHour: parsed.endHour || '22:00',
        holidayDates: parsed.holidayDates || [],
        weeklyHolidays: parsed.weeklyHolidays || [] // ده الجزء الجديد للإجازات الثابتة
    };
});

useEffect(() => {
    localStorage.setItem('smile_schedule_settings', JSON.stringify(clinicSchedule));
}, [clinicSchedule]);

// دالة لتصفية الأوقات المتاحة بناءً على مواعيد العمل
const getFilteredTimeSlots = () => {
    const allSlots = generateTimeSlots(); 
    const startMins = timeToMins(clinicSchedule.startHour);
    const endMins = timeToMins(clinicSchedule.endHour);
    
    return allSlots.filter(time => {
        const tMins = timeToMins(time);
        return tMins >= startMins && tMins <= endMins;
    });
};

// هنا اللوجيك بيحسب هل اليوم المختار إجازة بتاريخ محدد، أو يوم إجازة أسبوعي ثابت
const selectedDayOfWeek = new Date(selectedDate).getDay().toString(); // بيجيب رقم اليوم من 0 لـ 6
const isSelectedDateHoliday = clinicSchedule.holidayDates.includes(selectedDate) || clinicSchedule.weeklyHolidays.includes(selectedDayOfWeek);
const availableSlots = getFilteredTimeSlots();

    const bookAppointment = () => {
        if (!bookData.patientId || !bookData.time || !bookData.duration) return showMessage('تنبيه', 'برجاء استكمال بيانات الحجز');
        
        const startMins = timeToMins(bookData.time);
        const endMins = startMins + Number(bookData.duration);
        
        const isOverlap = appointments.filter(a => a.date === selectedDate).some(a => {
            const aStart = timeToMins(a.time), aEnd = aStart + Number(a.duration || 30);
            return startMins < aEnd && endMins > aStart;
        });
        
        if (isOverlap) return showMessage('تنبيه', 'عذراً، هناك حجز آخر في هذا التوقيت!');
        
        const newAppt = { id: Date.now().toString(), patientId: bookData.patientId, date: selectedDate, time: bookData.time, duration: Number(bookData.duration) };
        setAppointments(prev => [...prev, newAppt]);
        
        if (googleConfig.appsScriptUrl) {
            const patient = patients.find(p => p.id === bookData.patientId);
            syncEventToGoogleCalendar(newAppt, patient, googleConfig.appsScriptUrl, selectedDoctorEmail).then(res => {
                if(res.success) showMessage('نجاح', 'تم تسجيل الميعاد بنجاح في العيادة وجوجل كاليندر!');
                else showMessage('تنبيه', 'تم الحجز محلياً ولكن فشل الربط مع جوجل: ' + res.message);
            });
        } else {
            showMessage('نجاح', 'تم الحجز بنجاح!');
        }
        setBookData({time:'', patientId:'', duration:'30'});
    };

const cancelAppointment = (id, e) => { 
    e.stopPropagation();
    showConfirm('إلغاء الموعد', 'هل أنت متأكد من إلغاء هذا الحجز؟', () => {
        const apptToDelete = appointments.find(a => a.id === id);
        
        // 1. مسح الموعد من جوجل كاليندر (بشكل محمي)
        if (apptToDelete && googleConfig && googleConfig.appsScriptUrl) {
            const startMins = timeToMins(apptToDelete.time);
            const endMins = startMins + (apptToDelete.duration || 30);
            const endH = Math.floor(endMins / 60).toString().padStart(2, '0');
            const endM = (endMins % 60).toString().padStart(2, '0');
            
            let actualDocEmail = "";
            if (apptToDelete.doctorName && apptToDelete.doctorName !== 'د. أنور') {
                const foundDoc = (googleConfig.doctors || []).find(d => d.name === apptToDelete.doctorName || ("د. " + d.name) === apptToDelete.doctorName);
                if (foundDoc) actualDocEmail = foundDoc.email;
            }
            
            const eventPayload = { 
                action: "deleteEvent", 
                start: apptToDelete.date + "T" + apptToDelete.time + ":00",
                end: apptToDelete.date + "T" + endH + ":" + endM + ":00",
                doctorEmail: actualDocEmail 
            };
            
            fetch(googleConfig.appsScriptUrl, { 
                method: "POST", 
                headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                body: JSON.stringify(eventPayload) 
            }).catch(err => console.log("خطأ كاليندر:", err));
        }
        
        // 2. مسح الموعد من شاشة العيادة فوراً
        setAppointments(prev => prev.filter(a => a.id !== id));
        showMessage('نجاح', 'تم الإلغاء من الأجندة وجوجل كاليندر بنجاح.');
    });
