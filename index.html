            <div className="relative w-full" style={{ height: `${(parseInt(clinicSchedule.endHour.split(':')[0]) - parseInt(clinicSchedule.startHour.split(':')[0]) + 1) * 60}px` }}>
                
                {/* رسم الساعات بناءً على إعدادات بداية ونهاية المواعيد */}
                {Array.from({length: Math.max(1, parseInt(clinicSchedule.endHour.split(':')[0]) - parseInt(clinicSchedule.startHour.split(':')[0]) + 1)}).map((_, i) => {
                    const currentHour = parseInt(clinicSchedule.startHour.split(':')[0]) + i;
                    return (
                        <div key={i} className="absolute w-full border-t border-slate-200 flex items-start" style={{ top: `${i * 60}px` }}>
                            <div className="w-20 text-center pr-3 pt-1 text-xs font-bold text-slate-500 bg-slate-50 z-10 -mt-3.5">
                                {formatAMPM(`${currentHour.toString().padStart(2, '0')}:00`)}
                            </div>
                            <div className="flex-1 border-l border-slate-200 h-[60px] bg-white"></div>
                        </div>
                    );
                })}

                <div className="absolute top-0 bottom-0 left-20 right-4" style={{ direction: 'rtl' }}>
                    {dayAppointments.map((appt, idx) => {
                        const startH = parseInt(clinicSchedule.startHour.split(':')[0]);
                        const startMins = timeToMins(appt.time) - (startH * 60);
                        const height = appt.duration || 30;
                        const patient = patients.find(p => p.id === appt.patientId);
                        const colorClass = eventColors[idx % eventColors.length];
                        
                        // إخفاء أي موعد متسجل خارج أوقات العمل الحالية
                        if (startMins < 0) return null;

                        return (
                            <div key={appt.id} className={`absolute right-1 left-1 rounded-lg border-r-4 p-2 shadow-sm flex flex-col justify-between overflow-hidden transition-all hover:shadow-md ${colorClass}`} style={{ top: `${startMins}px`, height: `${height}px`, minHeight: '30px' }}>
                                <div className="flex justify-between items-start">
                                    <div className="font-bold text-sm truncate">{patient ? patient.name : 'مريض'}</div>
                                    <button onClick={(e) => cancelAppointment(appt.id, e)} className="text-red-500 hover:text-red-700"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            </div>
                        );
                    })}
                </div>
                
                {/* خط الوقت الحالي (لو إحنا في نفس اليوم والوقت جوه الشغل) */}
                {selectedDate === new Date().toISOString().split('T')[0] && ((new Date().getHours() * 60 + new Date().getMinutes()) - (parseInt(clinicSchedule.startHour.split(':')[0]) * 60)) >= 0 && (
                    <div className="absolute w-full border-t-2 border-red-500 z-30 animate-pulse" style={{ top: `${(new Date().getHours() * 60 + new Date().getMinutes()) - (parseInt(clinicSchedule.startHour.split(':')[0]) * 60)}px` }}></div>
                )}
            </div>
        </div>
    )}
</div>

                </div>
            )}
        </div>
    );
};

const InventorySterilizationHub = ({ userRole,
    inventory, setInventory, instruments, setInstruments, logs, setLogs, selectedDate, patients, showConfirm 
}) => {
const [activeTab, setActiveTab] = useState(userRole === 'admin' ? 'materials' : 'patientLogs');
    const [filterDate, setFilterDate] = useState(selectedDate);
    const [newItem, setNewItem] = useState({ name: '', stock: '', unitCost: '' });
    const [newInst, setNewInst] = useState({ name: '', clean: '' });
    
    // متغير التحميل (بدون أي تكرار)
    const [isAiInvLoading, setIsAiInvLoading] = useState(false);

    const handleSmartInventoryUpload = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        setIsAiInvLoading(true);
        try {
            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                const apiKey = loadData('smile_clinic_google_v12', {}).geminiApiKey || "API_KEY"; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{
                        parts: [
                            { text: `استخرج المنتجات من الصورة. حدد الخامات (materials) والآلات (instruments).
أريدك أن تكون ذكياً في الخامات: حول العبوة الكبيرة لعدد "الحالات" التي تكفيها (مثلاً سرنجة الكومبوزت تكفي 25 حالة، البوند 90، ريزن سيلر 45، الجوانتي 50 للعلبة الـ100، الألجينات 25 طبعة). وتكون هذه هي الكمية (stock). وسعر الوحدة (unitCost) يكون بقسمة السعر الكلي للعبوة على عدد الحالات.
أرجع JSON فقط بالصيغة: { "materials": [{"name": "اسم الخامة", "stock": عدد الحالات المتوقع, "unitCost": سعر الحالة الواحدة}], "instruments": [{"name": "اسم الآلة", "clean": العدد}] } بدون نصوص أخرى.` },
                            { inlineData: { mimeType: file.type || 'image/jpeg', data: base64Data } }
                        ]
                    }]
                };
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.candidates) {
                    let jsonStr = result.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const data = JSON.parse(jsonStr);
                    if (data.materials) {
                        const newMats = data.materials.map(m => ({ id: Date.now().toString() + Math.random(), name: m.name + ' (AI)', stock: Number(m.stock) || 1, unitCost: Number(m.unitCost).toFixed(2) || 0 }));
                        setInventory(prev => [...newMats, ...prev]);
                    }
                    if (data.instruments) {
                        const newInsts = data.instruments.map(i => ({ id: Date.now().toString() + Math.random(), name: i.name + ' (AI)', clean: Number(i.clean) || 1, sterilizing: 0, dirty: 0 }));
                        setInstruments(prev => [...newInsts, ...prev]);
                    }
                    alert('تم إضافة المنتجات وتقسيم الخامات لعدد الحالات بذكاء بنجاح!');
                }
            };
            reader.readAsDataURL(file);
        } catch (err) { alert('فشل تحليل الصورة، حاول بصورة أوضح.'); } 
        finally { setIsAiInvLoading(false); e.target.value = null; }
    };

    const matAlerts = inventory.filter(i => i.stock <= 5);
    const handleAddItem = () => { if (newItem.name && newItem.stock && newItem.unitCost) { setInventory([{ id: Date.now().toString(), name: newItem.name, stock: Number(newItem.stock), unitCost: Number(newItem.unitCost) }, ...inventory]); setNewItem({ name: '', stock: '', unitCost: '' }); } };
    const handleAddInst = () => { if (newInst.name && newInst.clean) { setInstruments([{ id: Date.now().toString(), name: newInst.name, clean: Number(newInst.clean), sterilizing: 0, dirty: 0 }, ...instruments]); setNewInst({ name: '', clean: '' }); } };
    
    const updateMat = (id, field, val) => setInventory(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
    const updateInst = (id, field, val) => setInstruments(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));

    const dailyInstLogs = logs.filter(l => l.date === filterDate && l.type === 'instrument');
    const logsByPatient = dailyInstLogs.reduce((acc, log) => {

        acc[log.patientId].push(log);
        return acc;
    }, {});

                if (newStatus === 'clean' && currentStatus === 'sterilizing') return {...inst, sterilizing: inst.sterilizing - qty, clean: inst.clean + qty};

            return inst;

// دالة دمج صور المريض في القالب (تخطي حظر درايف)
    const handleMergeTemplate = async () => {
        if(!socialForm.templateBase64) return showMessage('تنبيه', 'برجاء رفع القالب الشفاف (PNG) أولاً.');
        if(!selectedBeforeMedia || !selectedAfterMedia) return showMessage('تنبيه', 'برجاء اختيار صورة لـ "قبل" وصورة لـ "بعد" من معرض المريض بالأسفل.');

        setIsAiLoading(true);
        try {
            const fetchLocalBase64 = async (mediaObj) => {
                if (!mediaObj) return null;
                if (mediaObj.base64 && mediaObj.base64.length > 100) return mediaObj.base64;
                let src = mediaObj.url;
                let fileId = '';
                if (src.includes('drive.google.com')) {
                    if (src.includes('id=')) fileId = src.split('id=')[1].split('&')[0];
                    else if (src.includes('/d/')) fileId = src.split('/d/')[1].split('/')[0];
                }
                const targetUrl = fileId ? `https://drive.google.com/uc?id=${fileId}` : src;
                const proxies = [`https://wsrv.nl/?url=${encodeURIComponent(targetUrl)}&output=png`, `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`, `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`];

                for (let proxy of proxies) {
                    try {
                        const res = await fetch(proxy);
                        if (!res.ok) continue;
                        const blob = await res.blob();
                        if (!blob.type.includes('image')) continue; 
                        return await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve(reader.result);
                            reader.onerror = reject;
                            reader.readAsDataURL(blob);
                        });
                    } catch (e) { console.warn("Proxy fallback:", proxy); }
                }
                throw new Error("Failed to cache image locally");
            };

            const loadImgFromBase64 = (b64) => new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Failed to load base64 locally'));
                img.src = b64;
            });

            const beforeB64Local = await fetchLocalBase64(selectedBeforeMedia);
            const afterB64Local = await fetchLocalBase64(selectedAfterMedia);
            if(!beforeB64Local || !afterB64Local) throw new Error("Could not process local images");

            const templateImg = await loadImgFromBase64(socialForm.templateBase64);
            const beforeImg = await loadImgFromBase64(beforeB64Local);
            const afterImg = await loadImgFromBase64(afterB64Local);

            const canvas = document.createElement('canvas');
            canvas.width = templateImg.width;
            canvas.height = templateImg.height;
            const ctx = canvas.getContext('2d');

            const drawCover = (context, img, dx, dy, dw, dh) => {
                const imgRatio = img.width / img.height;
                const targetRatio = dw / dh;
                let sx = 0, sy = 0, sw = img.width, sh = img.height;
                if (imgRatio > targetRatio) { sw = img.height * targetRatio; sx = (img.width - sw) / 2; } 
                else { sh = img.width / targetRatio; sy = (img.height - sh) / 2; }
                context.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
            };

            const halfWidth = templateImg.width / 2;
            drawCover(ctx, beforeImg, halfWidth, 0, halfWidth, templateImg.height);
            drawCover(ctx, afterImg, 0, 0, halfWidth, templateImg.height);
            ctx.drawImage(templateImg, 0, 0, templateImg.width, templateImg.height);

            const finalMergedBase64 = canvas.toDataURL('image/png', 0.9);
            setMergedImageBase64(finalMergedBase64);
            showMessage('نجاح', 'تم سحب الصور لجهازك ودمجها داخل القالب بنجاح!');
        } catch(e) {
            console.error("Merge error:", e);
            showMessage('خطأ', 'فشل التخزين المحلي للصور بسبب إعدادات الشبكة.');
        } finally { setIsAiLoading(false); }
    };

    const handleWatermarkMerge = async () => {
        if(!watermarkLogoB64 || !watermarkTargetB64) return showMessage('تنبيه', 'برجاء رفع الشعار والصورة المراد ختمها أولاً.');
        setIsAiLoading(true);

                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Failed to load base64 locally'));
                img.src = b64;
            });

            const targetImg = await loadImgFromBase64(watermarkTargetB64);

            const canvas = document.createElement('canvas');
            canvas.width = targetImg.width;
            canvas.height = targetImg.height;
            const ctx = canvas.getContext('2d');

            // رسم الصورة الأصلية
            ctx.drawImage(targetImg, 0, 0, canvas.width, canvas.height);

            // حساب حجم الشعار (مثلاً 20% من عرض الصورة) مع الحفاظ على الأبعاد
            const logoWidth = canvas.width * 0.2;

            // تحديد موقع الشعار (أعلى اليمين) مع هامش
            const padding = canvas.width * 0.03;

            setWatermarkedResultB64(finalWatermarkedBase64);
            showMessage('نجاح', 'تم إدماج الشعار مع الصورة بنجاح!');

type="password"

const LabView = ({ userRole, patients, setPatients, showMessage, showConfirm, selectedDate }) => {
    // تبويبات: 'active', 'history', 'invoices'
    const [labTab, setLabTab] = useState('active'); 
    const [delayState, setDelayState] = useState({ orderId: null, patientId: null, newDate: selectedDate });
    
    // متغيرات الفواتير اليومية والشهرية
    const [invoiceDate, setInvoiceDate] = useState(selectedDate);
    const [invoiceMonth, setInvoiceMonth] = useState(selectedDate.substring(0, 7)); // YYYY-MM
    const [aiInsight, setAiInsight] = useState('');
    const [isAiLoading, setIsAiLoading] = useState(false);
const [socialImageModel, setSocialImageModel] = useState('gemini-3-pro-image');

    const handleNextInvoiceDay = () => setInvoiceDate(getDateXDaysAgo(-1, invoiceDate));
    const handlePrevInvoiceDay = () => setInvoiceDate(getDateXDaysAgo(1, invoiceDate));

    // دالة مساعدة لتغيير الأيام
    function getDateXDaysAgo(days, baseDateStr) {
        const d = new Date(baseDateStr);
        d.setDate(d.getDate() - days);
        return d.toISOString().split('T')[0];
    }

    let activeOrders = [];
    let historyOrders = [];
    let dailyInvoices = []; // الشغل اليومي
    let monthlyInvoices = []; // الشغل الشهري

    patients.forEach(p => {
        if (p.labOrders) {
            p.labOrders.forEach(order => {
                const orderData = { ...order, patientId: p.id, patientName: p.name, patientPhone: p.phone };
                
                // للحالات النشطة والسجل
                if (order.status === 'delivered') historyOrders.push(orderData);
                else activeOrders.push(orderData);

                // لفاتورة المعمل اليومية (مبنية على تاريخ بدء الحالة)
                if (order.startDate === invoiceDate) dailyInvoices.push(orderData);

                // لفاتورة المعمل الشهرية
                if (order.startDate && order.startDate.startsWith(invoiceMonth)) monthlyInvoices.push(orderData);
            });
        }
    });

    activeOrders.sort((a, b) => new Date(a.deliveryDate) - new Date(b.deliveryDate));
    historyOrders.sort((a, b) => new Date(b.deliveredOn) - new Date(a.deliveredOn));

    const updateOrderStatus = (patientId, orderId, newStatus, extraData = {}) => {
        setPatients(prev => prev.map(p => {
            if (p.id === patientId) {
                const updatedOrders = p.labOrders.map(o => {
                    if (o.id === orderId) return { ...o, status: newStatus, ...extraData };
                    return o;
                });
                return { ...p, labOrders: updatedOrders };
            }
            return p;
        }));
    };

    const handleDeliver = (patientId, orderId) => {
        showConfirm('تأكيد التسليم', 'هل تم تسليم التركيبة للمريض بنجاح؟', () => {
            updateOrderStatus(patientId, orderId, 'delivered', { deliveredOn: new Date().toISOString().split('T')[0] });
            showMessage('نجاح', 'تم تسجيل التركيبة كـ "مُسلمة" ونقلها للأرشيف.');
        });
    };

    const handleDelay = () => {
        if (!delayState.newDate) return showMessage('تنبيه', 'برجاء تحديد الموعد الجديد.');
        updateOrderStatus(delayState.patientId, delayState.orderId, 'delayed', { deliveryDate: delayState.newDate });
        showMessage('نجاح', 'تم تأجيل موعد التسليم وتحديث حالة التركيبة.');
        setDelayState({ orderId: null, patientId: null, newDate: selectedDate }); 
    };

    // استخراج الفاتورة الشهرية كملف إكسيل
    const exportLabMonthExcel = () => {
        if (monthlyInvoices.length === 0) return showMessage('تنبيه', 'لا يوجد شغل مسجل للمعامل في هذا الشهر.');

        // ترتيب الحالات حسب اسم المعمل علشان الفاتورة تكون منظمة
        const sortedForExcel = [...monthlyInvoices].sort((a, b) => (a.labName || '').localeCompare(b.labName || ''));
        
        const dataForExcel = sortedForExcel.map(o => ({
            'اسم المعمل': o.labName || 'غير مسجل',
            'تاريخ البدء': o.startDate,
            'اسم المريض': o.patientName,
            'التركيبة': o.type,
            'الوحدات': Number(o.units || 1),
            'تاريخ التسليم المتوقع': o.deliveryDate,
            'الحالة': o.status === 'delivered' ? 'تم التسليم' : o.status === 'delayed' ? 'متأخرة' : 'قيد التنفيذ',
            'السعر المطلوب (ج.م)': Number(o.price || 0)
        }));

        try {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dataForExcel);
            XLSX.utils.book_append_sheet(wb, ws, "شغل المعامل");
            XLSX.writeFile(wb, `Lab_Invoices_${invoiceMonth}.xlsx`);
            showMessage('نجاح', 'تم استخراج فاتورة الشهر كملف إكسيل بنجاح.');
        } catch (error) {
            showMessage('خطأ', 'حدث خطأ أثناء التصدير.');
        }
    };

    // التحليل الذكي لفاتورة المعمل
    const analyzeLabDataWithAI = async () => {
        if (monthlyInvoices.length === 0) return showMessage('تنبيه', 'لا يوجد بيانات لتحليلها في هذا الشهر.');
        setIsAiLoading(true);
        setAiInsight('');

        let totalUnits = 0;
        let totalCost = 0;
        let labStats = {};

        monthlyInvoices.forEach(o => {
            totalUnits += Number(o.units || 1);
            totalCost += Number(o.price || 0);
            const labName = o.labName || 'مجهول';
            if (!labStats[labName]) labStats[labName] = { units: 0, cost: 0 };
            labStats[labName].units += Number(o.units || 1);
            labStats[labName].cost += Number(o.price || 0);
        });

        let promptText = `أنت مدير حسابات في مركز SMILEY CENTER. هذه إحصائيات المعامل لشهر (${invoiceMonth}):
        - الإجمالي الكلي: ${totalUnits} وحدة بتكلفة ${totalCost} ج.م.
        - تفاصيل المعامل: ${JSON.stringify(labStats)}.
        المطلوب: اكتب تقرير مختصر وواضح لتقييم الشغل الموزع على المعامل، وهل هناك معمل مسيطر على الشغل؟ واقترح نصائح لتقليل التكلفة أو التفاوض مع المعامل.`;

        try {
            const apiKey = loadData('smile_clinic_google_v12', {}).geminiApiKey || "API_KEY";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: promptText }] }] };
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            if (result.candidates) setAiInsight(result.candidates[0].content.parts[0].text);
        } catch (error) { showMessage('خطأ', 'فشل الاتصال بالذكاء الاصطناعي.'); } finally { setIsAiLoading(false); }
    };

    return (
        <div className="p-4 md:p-8 pb-28 md:pb-8 h-full overflow-y-auto bg-slate-50 animate-fade-in text-right">
            
            {isAiLoading && (
                <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-fade-in text-center">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border-2 border-brand-gold/40">
                        <i className="fa-solid fa-robot text-4xl mb-4 text-brand-navy animate-bounce"></i>
                        <h3 className="text-xl font-bold text-brand-navy mb-2">جاري تحليل البيانات...</h3>
                        <p className="text-sm text-slate-500 font-bold">المساعد الذكي يقوم بدراسة فواتير المعامل الآن.</p>
                    </div>
                </div>
            )}

            <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold flex items-center gap-2 text-brand-navy">
                    <i className="fa-solid fa-tooth text-brand-gold"></i> التركيبات والمعمل
                </h2>
            </div>

            <div className="flex bg-slate-100 p-1.5 rounded-xl mb-6 shadow-inner text-sm font-bold border border-slate-200 gap-1 flex-col md:flex-row">
                <button onClick={() => setLabTab('active')} className={`flex-1 py-3 px-4 rounded-lg transition-colors whitespace-nowrap ${labTab === 'active' ? 'bg-[#0B2545] text-white shadow' : 'text-slate-500 hover:bg-slate-200'}`}>
                    <i className="fa-solid fa-clock-rotate-left ml-1"></i> قيد الانتظار ({activeOrders.length})
                </button>
                <button onClick={() => setLabTab('history')} className={`flex-1 py-3 px-4 rounded-lg transition-colors whitespace-nowrap ${labTab === 'history' ? 'bg-[#0B2545] text-white shadow' : 'text-slate-500 hover:bg-slate-200'}`}>
                    <i className="fa-solid fa-check-double ml-1"></i> سجل التسليمات ({historyOrders.length})
                </button>
{userRole === 'admin' &&
                <button onClick={() => setLabTab('invoices')} className={`flex-1 py-3 px-4 rounded-lg transition-colors whitespace-nowrap ${labTab === 'invoices' ? 'bg-[#0B2545] text-white shadow' : 'text-slate-500 hover:bg-slate-200'}`}>
                    <i className="fa-solid fa-file-invoice-dollar ml-1"></i> فاتورة المعمل (يومي/شهري)
                </button>
}

            </div>

            {/* --- تبويب قيد الانتظار والتسليمات القديمة يظل كما هو --- */}
            {labTab === 'active' && (
                <div className="space-y-4">
                    {activeOrders.length === 0 ? (
                        <div className="text-center py-10 opacity-50 bg-white rounded-2xl border border-slate-200">
                            <i className="fa-solid fa-box-open text-5xl mb-3 text-slate-400"></i>
                            <p className="font-bold text-slate-500 text-lg">لا توجد تركيبات قيد التنفيذ حالياً.</p>
                        </div>
                    ) : activeOrders.map(order => (
                        <div key={order.id} className={`bg-white rounded-2xl shadow-sm border p-5 relative overflow-hidden ${order.status === 'delayed' ? 'border-red-300' : 'border-slate-200'}`}>
                            {order.status === 'delayed' && <div className="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl shadow-sm animate-pulse">متأخرة</div>}
                            
                            <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 border-b border-slate-100 pb-4 mb-4">
                                <div>
                                    <h3 className="font-bold text-lg text-brand-navy">{order.patientName}</h3>
                                    <p className="text-xs text-slate-500 mt-1" dir="ltr">{order.patientPhone}</p>
                                    <p className="text-xs text-brand-navy font-bold mt-1 bg-brand-light inline-block px-2 py-1 rounded">معمل: {order.labName}</p>
                                </div>
                                <div className="bg-brand-light border border-brand-gold/30 px-4 py-2 rounded-xl text-center">
                                    <span className="block text-[10px] text-slate-500 mb-0.5">موعد التسليم المتوقع</span>
                                    <span className={`font-black ${order.deliveryDate < new Date().toISOString().split('T')[0] ? 'text-red-600' : 'text-brand-navy'}`}>{order.deliveryDate}</span>
                                </div>
                            </div>

                            <div className="mb-4 space-y-2">
                                <p className="text-sm font-bold text-slate-800"><span className="text-brand-gold mr-1">النوع:</span> {order.type} ({order.units} وحدات)</p>
                                {order.notes && <p className="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100"><i className="fa-solid fa-pen text-slate-400 ml-1"></i> {order.notes}</p>}
                            </div>

                            {delayState.orderId === order.id ? (
                                <div className="bg-orange-50 p-3 rounded-xl border border-orange-200 flex flex-col md:flex-row gap-3 items-center animate-fade-in">
                                    <label className="text-xs font-bold text-orange-800">تحديد الموعد الجديد:</label>
                                    <input type="date" value={delayState.newDate} onChange={e => setDelayState({...delayState, newDate: e.target.value})} className="bg-white border border-orange-300 p-2 rounded-lg outline-none text-sm flex-1 w-full" />
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <button onClick={handleDelay} className="flex-1 bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-orange-600">تأكيد التأجيل</button>
                                        <button onClick={() => setDelayState({ orderId: null, patientId: null, newDate: selectedDate })} className="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-300">إلغاء</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex gap-3">
                                    <button onClick={() => handleDeliver(order.patientId, order.id)} className="flex-1 bg-green-600 text-white py-2.5 rounded-xl text-sm font-bold shadow-sm hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-check"></i> تم التسليم
                                    </button>
                                    <button onClick={() => setDelayState({ orderId: order.id, patientId: order.patientId, newDate: order.deliveryDate })} className="bg-orange-100 text-orange-700 border border-orange-200 px-6 py-2.5 rounded-xl text-sm font-bold shadow-sm hover:bg-orange-200 transition-colors flex items-center justify-center gap-2">
                                        <i className="fa-regular fa-calendar-xmark"></i> تأجيل
                                    </button>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            )}

                                    {modalConfig.type === 'confirm' ? (
                                        <>
                                            <button onClick={() => { if (modalConfig.onConfirm) modalConfig.onConfirm(); setModalConfig({ ...modalConfig, isOpen: false }); }} className="flex-1 bg-brand-navy text-brand-gold py-3 rounded-xl font-bold shadow-md hover:bg-brand-blue">تأكيد</button>
                                            <button onClick={() => setModalConfig({ ...modalConfig, isOpen: false })} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold shadow-sm hover:bg-slate-200">إلغاء</button>
                                        </>
                                    ) : (
                                        <button onClick={() => setModalConfig({ ...modalConfig, isOpen: false })} className="w-full bg-brand-navy text-brand-gold py-3 rounded-xl font-bold shadow-md hover:bg-brand-blue">موافق</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>



<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    console.log('Service worker registered.', reg);
                });
            });
        }
    </script>


</body>
</html>
